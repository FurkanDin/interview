<div class="row mb-4">
    <div class="col-auto">
        <select class="form-select" id="games" onchange="fetchProducts(this.value)">
            <option value="0">{$LANG.all_games}</option>
            {foreach $games as $game_id => $game_name}
                <option value="{$game_id}">{$game_name}</option>
            {/foreach}
        </select>
    </div>
</div>

<div class="table-responsive" id="products-container" style="display: none;">
    <table class="table table-striped table-hover" id="products-table">
        <thead>
            <tr>
                <th>{$LANG.prd_name}</th>
                <th>{$LANG.stock}</th>
                <th>{$LANG.price}</th>
                <th>{$LANG.quantity}</th>
                <th>İşlem</th>
            </tr>
        </thead>
        <tbody>
            <!-- Products will be loaded here via JS -->
        </tbody>
    </table>
</div>

<!-- Order Result Modal -->
<div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="orderModalLabel">Sipariş Sonucu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="orderModalBody">
        <!-- Message will be injected here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
      </div>
    </div>
  </div>
</div>

<script>
    function fetchProducts(gameId) {
        const container = document.getElementById('products-container');
        const tbody = document.querySelector('#products-table tbody');
        
        if (gameId == 0) {
            container.style.display = 'none';
            tbody.innerHTML = '';
            return;
        }

        tbody.innerHTML = '<tr><td colspan="5" class="text-center">Yükleniyor...</td></tr>';
        container.style.display = 'block';

        fetch(`/api/products/${gameId}`)
            .then(res => res.json())
            .then(res => {
                if (!res.success) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center">${res.message}</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                let products = res.data.data || res.data; // Depending on API structure
                if (!Array.isArray(products) || products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">Bu oyuna ait ürün bulunamadı.</td></tr>';
                    return;
                }

                products.forEach(product => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${product.name || 'Ürün'}</td>
                        <td>${product.stock || 'Bilinmiyor'}</td>
                        <td>${product.price || 0}</td>
                        <td>
                            <input type="number" class="form-control" value="1" min="${product.min_order || 1}" max="${product.max_order || 99}" id="quantity_${product.id}">
                        </td>
                        <td>
                            <button type="button" class="btn btn-primary btn-sm" onclick="placeOrder(this, ${product.id})" id="btn_${product.id}">{$LANG.buy}</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center">Bağlantı hatası oluştu.</td></tr>';
            });
    }

    function placeOrder(btn, productId) {
        const quantityInput = document.getElementById(`quantity_${productId}`);
        const quantity = quantityInput ? quantityInput.value : 1;

        // Double submit protection
        btn.disabled = true;
        const originalText = btn.innerText;
        btn.innerText = 'Bekleyiniz...';

        const formData = new FormData();
        formData.append('product_id', productId);
        formData.append('quantity', quantity);

        fetch('/api/order', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(res => {
            const modalBody = document.getElementById('orderModalBody');
            if (res.success) {
                modalBody.innerHTML = `<div class="alert alert-success">${res.message}</div>`;
            } else {
                modalBody.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
            }
            
            const orderModal = new bootstrap.Modal(document.getElementById('orderModal'));
            orderModal.show();
        })
        .catch(err => {
            alert('Sipariş gönderilirken hata oluştu.');
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = originalText;
        });
    }
</script>
