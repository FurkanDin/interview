<!doctype html>
<html lang="{$LANG.lang}" data-bs-theme="dark" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{$LANG.title}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Modern Color Palette System (Light & Dark) */
        [data-bs-theme="dark"] {
            --bg-main: #0b0f19;
            --bg-radial-1: rgba(99, 102, 241, 0.12);
            --bg-radial-2: rgba(168, 85, 247, 0.1);
            --card-bg: rgba(23, 31, 50, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(255, 255, 255, 0.18);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --nav-bg: rgba(11, 15, 25, 0.85);
            --input-bg: rgba(255, 255, 255, 0.06);
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        [data-bs-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-radial-1: rgba(99, 102, 241, 0.08);
            --bg-radial-2: rgba(168, 85, 247, 0.06);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(203, 213, 225, 0.6);
            --card-hover-border: rgba(99, 102, 241, 0.4);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --nav-bg: rgba(255, 255, 255, 0.9);
            --input-bg: rgba(241, 245, 249, 0.9);
            --modal-bg: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 15% 15%, var(--bg-radial-1) 0px, transparent 50%),
                radial-gradient(at 85% 85%, var(--bg-radial-2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3, h4, h5, h6, .brand-title {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .glass-card:hover {
            border-color: var(--card-hover-border);
        }

        /* Navbar */
        .navbar-glass {
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            transition: background-color 0.3s ease;
        }

        .brand-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .badge-cart {
            font-size: 0.75rem;
            padding: 0.3em 0.6em;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
        }

        /* Buttons */
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #fff !important;
            border: none;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-outline-glass {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .btn-outline-glass:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #6366f1;
            border-color: #6366f1;
        }

        /* Offcanvas Drawer */
        .offcanvas-glass {
            background: var(--modal-bg);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--card-border);
            color: var(--text-main);
        }

        /* Form Controls */
        .form-control-glass, .form-select-glass {
            background: var(--input-bg) !important;
            border: 1px solid var(--card-border) !important;
            color: var(--text-main) !important;
            border-radius: 12px;
            padding: 0.65rem 1rem;
        }

        .form-select-glass option {
            background-color: var(--modal-bg) !important;
            color: var(--text-main) !important;
            padding: 10px;
        }

        .form-control-glass:focus, .form-select-glass:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.2) !important;
        }

        /* Toast Container */
        .toast-container-custom {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1090;
        }

        .toast-glass {
            background: var(--modal-bg) !important;
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 14px;
        }
    </style>
</head>

<body class="d-flex flex-column h-100">
    <!-- Sticky Glass Navbar -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-glass py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                    <div class="p-2 rounded-3 d-inline-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #6366f1, #a855f7); width: 38px; height: 38px;">
                        <i class="bi bi-controller text-white fs-5"></i>
                    </div>
                    <span class="fs-4 brand-title brand-gradient">{$LANG.title}</span>
                </a>

                <div class="d-flex align-items-center gap-2 gap-sm-3 ms-auto">
                    <!-- Theme Toggle Button -->
                    <button class="btn btn-outline-glass btn-sm rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;" type="button" id="themeToggleBtn" onclick="toggleTheme()" title="{$LANG.theme_toggle}">
                        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                    </button>

                    <!-- Order History Button -->
                    <button class="btn btn-outline-glass btn-sm rounded-pill px-3 py-2" type="button" data-bs-toggle="modal" data-bs-target="#historyModal" onclick="renderOrderHistory()">
                        <i class="bi bi-clock-history me-1"></i> <span class="d-none d-sm-inline">{$LANG.order_history}</span>
                    </button>

                    <!-- Cart Trigger Button -->
                    <button class="btn btn-gradient btn-sm rounded-pill px-3 py-2 position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartDrawer">
                        <i class="bi bi-cart3 me-1"></i> {$LANG.cart}
                        <span id="cartCountBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill badge-cart" style="display: none;">0</span>
                    </button>

                    <!-- Flagged Language Switcher -->
                    <div class="btn-group p-1 rounded-pill glass-card border border-secondary border-opacity-25" role="group" aria-label="Language selector">
                        <a href="?lang=tr" class="btn btn-sm rounded-pill px-2.5 py-1 text-decoration-none d-flex align-items-center gap-1 {if $LANG.lang == 'tr'}btn-gradient text-white shadow-sm fw-bold{else}text-body opacity-75 fw-normal{/if}" title="Türkçe">
                            <span style="font-size: 1rem;">🇹🇷</span>
                            <span class="small">TR</span>
                        </a>
                        <a href="?lang=en" class="btn btn-sm rounded-pill px-2.5 py-1 text-decoration-none d-flex align-items-center gap-1 {if $LANG.lang == 'en'}btn-gradient text-white shadow-sm fw-bold{else}text-body opacity-75 fw-normal{/if}" title="English">
                            <span style="font-size: 1rem;">🇬🇧</span>
                            <span class="small">EN</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-shrink-0 py-4 py-md-5">
        <div class="container">
            {if $error}
                <div class="alert alert-danger glass-card border-danger text-danger mb-4 p-3 d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                    <div>{$error}</div>
                </div>
            {/if}

            {if $template}
                {include file=$template}
            {/if}
        </div>
    </main>

    <!-- Offcanvas Shopping Cart Drawer -->
    <div class="offcanvas offcanvas-end offcanvas-glass" tabindex="-1" id="cartDrawer" aria-labelledby="cartDrawerLabel">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25 py-3">
            <h5 class="offcanvas-title brand-title d-flex align-items-center gap-2" id="cartDrawerLabel">
                <i class="bi bi-cart-check text-primary"></i> {$LANG.cart}
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="{$LANG.close_label}"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-4">
            <div id="cartItemsContainer" class="flex-grow-1 overflow-auto pe-1">
                <!-- Cart Items rendered via JS -->
            </div>
            
            <div id="cartSummaryContainer" class="border-top border-secondary border-opacity-25 pt-3 mt-3" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted">{$LANG.cart_total}:</span>
                    <span class="fs-4 fw-bold text-success" id="cartTotalAmount">₺0.00</span>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-gradient py-2.5 rounded-3 fw-bold" id="btnCartCheckout" onclick="processCartCheckout()">
                        <i class="bi bi-shield-check me-1"></i> {$LANG.checkout}
                    </button>
                    <button type="button" class="btn btn-outline-glass btn-sm py-2 rounded-3 text-muted" onclick="clearCart()">
                        <i class="bi bi-trash me-1"></i> {$LANG.clear_cart}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Order History Modal -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title brand-title d-flex align-items-center gap-2" id="historyModalLabel">
                        <i class="bi bi-clock-history text-primary"></i> {$LANG.order_history}
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{$LANG.close_label}"></button>
                </div>
                <div class="modal-body p-4" id="orderHistoryContainer">
                    <!-- History items rendered via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container-custom" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="footer mt-auto py-4 border-top border-secondary border-opacity-25" style="background: var(--nav-bg);">
        <div class="container text-center text-muted small">
            <p class="mb-0">&copy; 2026 Turkpin E-Pin Integration Platform. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.APP_LANG = {$LANG_JSON nofilter};
    </script>

    <!-- Application Main Script -->
    <script src="/assets/js/app.js"></script>
</body>

</html>
