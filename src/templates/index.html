<!doctype html>
<html lang="{$LANG.lang}" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{$LANG.title}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(23, 31, 50, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .brand-title {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* Navbar */
        .navbar-glass {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
        }

        .brand-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .badge-cart {
            font-size: 0.75rem;
            padding: 0.3em 0.6em;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
        }

        /* Buttons */
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #fff;
            border: none;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
            color: #fff;
        }

        .btn-gradient:active {
            transform: translateY(0);
        }

        .btn-outline-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .btn-outline-glass:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Offcanvas Drawer */
        .offcanvas-glass {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--card-border);
            color: var(--text-main);
        }

        /* Form Controls */
        .form-control-glass, .form-select-glass {
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            color: var(--text-main) !important;
            border-radius: 12px;
            padding: 0.75rem 1rem;
        }

        .form-control-glass:focus, .form-select-glass:focus {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: var(--accent-primary) !important;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25) !important;
        }

        .form-select-glass option {
            background: #1e293b;
            color: #fff;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(11, 15, 25, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Toast Container */
        .toast-container-custom {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 1090;
        }

        .toast-glass {
            background: rgba(30, 41, 59, 0.9) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 14px;
        }
    </style>
</head>

<body class="d-flex flex-column h-100">
    <!-- Sticky Glass Navbar -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-glass py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                    <div class="p-2 rounded-3 bg-indigo-600 d-inline-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #6366f1, #a855f7); width: 38px; height: 38px;">
                        <i class="bi bi-controller text-white fs-5"></i>
                    </div>
                    <span class="fs-4 brand-title brand-gradient">{$LANG.title}</span>
                </a>

                <div class="d-flex align-items-center gap-3 ms-auto">
                    <!-- Order History Button -->
                    <button class="btn btn-outline-glass btn-sm rounded-pill px-3 py-2" type="button" data-bs-toggle="modal" data-bs-target="#historyModal" onclick="renderOrderHistory()">
                        <i class="bi bi-clock-history me-1"></i> <span class="d-none d-sm-inline">{$LANG.order_history}</span>
                    </button>

                    <!-- Cart Trigger Button -->
                    <button class="btn btn-gradient btn-sm rounded-pill px-3 py-2 position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartDrawer">
                        <i class="bi bi-cart3 me-1"></i> {$LANG.cart}
                        <span id="cartCountBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill badge-cart" style="display: none;">0</span>
                    </button>

                    <!-- Language Switcher -->
                    <form method="get" action="" class="m-0">
                        <select name="lang" id="lang" class="form-select form-select-sm form-select-glass rounded-pill px-3" onchange="this.form.submit()">
                            {foreach $langs as $key => $value}
                                <option value="{$key}" {if $key == $LANG.lang}selected{/if}>{$value}</option>
                            {/foreach}
                        </select>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-shrink-0 py-4 py-md-5">
        <div class="container">
            {if $error}
                <div class="alert alert-danger glass-card border-danger text-white mb-4 p-3 d-flex align-items-center gap-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
                    <div>{$error}</div>
                </div>
            {/if}

            {if $template}
                {include file=$template}
            {/if}
        </div>
    </main>

    <!-- Offcanvas Shopping Cart Drawer -->
    <div class="offcanvas offcanvas-end offcanvas-glass" tabindex="-1" id="cartDrawer" aria-labelledby="cartDrawerLabel">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25 py-3">
            <h5 class="offcanvas-title brand-title d-flex align-items-center gap-2" id="cartDrawerLabel">
                <i class="bi bi-cart-check text-indigo-400"></i> {$LANG.cart}
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-4">
            <div id="cartItemsContainer" class="flex-grow-1 overflow-auto pe-1">
                <!-- Cart Items rendered via JS -->
            </div>
            
            <div id="cartSummaryContainer" class="border-top border-secondary border-opacity-25 pt-3 mt-3" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted">{$LANG.cart_total}:</span>
                    <span class="fs-4 fw-bold text-success" id="cartTotalAmount">₺0.00</span>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-gradient py-2.5 rounded-3 fw-bold" id="btnCartCheckout" onclick="processCartCheckout()">
                        <i class="bi bi-shield-check me-1"></i> {$LANG.checkout}
                    </button>
                    <button type="button" class="btn btn-outline-glass btn-sm py-2 rounded-3 text-muted" onclick="clearCart()">
                        <i class="bi bi-trash me-1"></i> {$LANG.clear_cart}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Order History Modal -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card text-white">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title brand-title d-flex align-items-center gap-2" id="historyModalLabel">
                        <i class="bi bi-clock-history text-indigo-400"></i> {$LANG.order_history}
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="orderHistoryContainer">
                    <!-- History items rendered via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container-custom" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="footer mt-auto py-4 border-top border-secondary border-opacity-25" style="background: rgba(11, 15, 25, 0.9);">
        <div class="container text-center text-muted small">
            <p class="mb-0">&copy; 2026 Turkpin E-Pin Integration Platform. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
